<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz | Auto-Lecture Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .card-hover:hover { border-color: #3b82f6; transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="glass sticky top-0 z-50 p-4 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">DEVCODERZ <span class="text-white font-light text-sm underline">v2.0</span></h1>
            <div class="space-x-4">
                <button onclick="fetchLectures('11')" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Class 11th</button>
                <button onclick="fetchLectures('12')" class="bg-purple-600 px-4 py-2 rounded-lg text-sm font-bold">Class 12th</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4">
        <div id="loader" class="hidden text-center py-20 text-blue-400">
            <i class="fas fa-circle-notch fa-spin text-4xl"></i>
            <p class="mt-4">Scanning for new lectures...</p>
        </div>

        <div id="lecture-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        const PROXY_URL = "http://127.0.0.1:5000/api/lectures";

        async function fetchLectures(classId) {
            const grid = document.getElementById('lecture-grid');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const response = await fetch(`${PROXY_URL}?class=${classId}`);
                const data = await response.json();
                
                loader.classList.add('hidden');
                
                if (data && data.length > 0) {
                    renderCards(data);
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 opacity-50">No new lectures found for Class ${classId}</div>`;
                }
            } catch (err) {
                loader.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-full text-red-500 text-center">Proxy Server is Offline! Run server.py first.</div>`;
            }
        }

        function renderCards(lectures) {
            const grid = document.getElementById('lecture-grid');
            
            lectures.forEach(item => {
                const card = `
                    <div class="glass p-6 rounded-2xl card-hover relative overflow-hidden">
                        <div class="absolute top-0 right-0 bg-blue-600 text-[10px] px-3 py-1 rounded-bl-xl font-bold uppercase tracking-widest">
                            New
                        </div>
                        <p class="text-blue-400 text-xs font-bold uppercase mb-2">${item.Exam || 'LECTURE'}</p>
                        <h2 class="text-xl font-bold leading-tight mb-4">${item.topic || 'Class Topic'}</h2>
                        
                        <div class="flex items-center text-xs text-gray-400 space-x-4 mb-6">
                            <span><i class="far fa-calendar-alt mr-2"></i>${item.date_and_time}</span>
                            <span><i class="fas fa-folder-open mr-2"></i>Concept ${item.concept}</span>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="playVideo('${item.video_id}')" class="flex-1 bg-white text-black py-3 rounded-xl font-bold hover:bg-blue-500 hover:text-white transition">
                                <i class="fas fa-play mr-2"></i>Watch
                            </button>
                            <button onclick="window.open('${item.pdf_link}')" class="bg-gray-800 px-5 rounded-xl border border-gray-600">
                                <i class="fas fa-file-pdf"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function playVideo(id) {
            // Yahan apna DevCoderz player ya HLS logic dalein
            alert("Streaming Started: " + id);
        }

        // Auto-load Class 11 on start
        window.onload = () => fetchLectures('11');
    </script>
</body>
</html>
