<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>
    <video id="vid" crossorigin="anonymous" playsinline controls autoplay></video>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');
        const vid = document.getElementById('vid');

        if (!lId || !bId) return;

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            shaka.polyfill.installAll();
            const player = new shaka.Player(vid);

            if (data.drmKeys && data.drmKeys.clearKeys) {
                const keys = {};
                for (let kid in data.drmKeys.clearKeys) {
                    keys[kid.replace(/-/g, "")] = data.drmKeys.clearKeys[kid];
                }
                player.configure({
                    drm: {
                        clearKeys: keys
                    }
                });
            }

            await player.load(data.url);
            vid.play();
        } catch (e) {
            console.error("Critical Error:", e);
        }
    })();
</script>
</body>
</html>
