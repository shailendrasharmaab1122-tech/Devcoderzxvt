<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>
    <video id="vid" crossorigin="anonymous" playsinline controls></video>

<script>
    (function() {
        if (window.MediaSource && typeof window.MediaSource.isTypeSupported === 'function') {
            const orig = window.MediaSource.isTypeSupported;
            window.MediaSource.isTypeSupported = (t) => {
                if (t && (t.includes('hev1') || t.includes('hvc1'))) return false;
                return orig.call(MediaSource, t);
            };
        }
    })();

    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');
        const vid = document.getElementById('vid');

        if (!lId || !bId) return;

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            shaka.polyfill.installAll();
            const player = new shaka.Player(vid);
            const playerUI = new Plyr(vid, { autoplay: true });

            player.configure({
                streaming: { bufferingGoal: 30, rebufferingGoal: 2 },
                drm: { clearKeys: data.drmKeys?.clearKeys }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                const url = new URL(request.uris[0]);
                if (data.url.includes('Expires=')) {
                    const params = new URL(data.url).searchParams;
                    url.searchParams.set('Expires', params.get('Expires'));
                    url.searchParams.set('KeyName', params.get('KeyName'));
                    url.searchParams.set('Signature', params.get('Signature'));
                }
                request.uris[0] = url.toString();
            });

            await player.load(data.url);

            const posKey = 'pos_' + lId;
            const savedPos = localStorage.getItem(posKey);
            if (savedPos && vid.duration) vid.currentTime = parseFloat(savedPos);

            setInterval(() => {
                if (!vid.paused && vid.currentTime > 5) localStorage.setItem(posKey, vid.currentTime);
            }, 5000);

        } catch (e) {
            console.error(e);
        }
    })();
</script>
</body>
</html>
