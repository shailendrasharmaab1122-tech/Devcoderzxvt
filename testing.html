<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz | Smart Lecture Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <style>
        body { background: #050811; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-nav { background: rgba(10, 15, 28, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid #1e293b; }
        .video-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; transition: 0.3s; }
        .video-card:hover { border-color: #3b82f6; transform: translateY(-3px); }
        
        /* Pop-up aur Watermark Hider Logic */
        #watermark, .edu-popup, .modal-overlay, #inject_idm_text_selection {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter text-blue-500">DEVCODERZ <span class="text-[10px] text-white font-mono">X VIBRANT</span></h1>
            <div class="flex gap-2">
                <button onclick="loadClass('11')" class="bg-blue-600/20 text-blue-400 border border-blue-600/30 px-3 py-1 rounded-full text-xs font-bold">Class 11</button>
                <button onclick="loadClass('12')" class="bg-purple-600/20 text-purple-400 border border-purple-600/30 px-3 py-1 rounded-full text-xs font-bold">Class 12</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-5xl">
        
        <div id="player-container" class="hidden mb-8">
            <div class="relative rounded-2xl overflow-hidden shadow-2xl border border-gray-800 bg-black">
                <video id="my-video" class="video-js vjs-big-play-centered w-full aspect-video" controls preload="auto" data-setup='{}'></video>
                <button onclick="closePlayer()" class="absolute top-2 right-2 bg-red-600/80 text-white p-2 rounded-full text-xs z-10"><i class="fas fa-times"></i> Close</button>
            </div>
            <h2 id="current-title" class="mt-4 text-xl font-bold text-white"></h2>
        </div>

        <div id="lecture-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>

    </main>

    <footer class="mt-20 py-8 border-t border-gray-900 text-center">
        <p class="text-gray-500 text-sm">© 2026 DevCoderz Project</p>
        <p class="text-blue-500 font-bold text-xs uppercase mt-1">Developed by Devansh Sharma</p>
        <p class="text-gray-600 text-[10px] mt-2 italic">Automated Sync Enabled for Class 11th & 12th</p>
    </footer>

    <script>
        // Placeholder Data (Real data will come from your Proxy Server)
        const sampleData = [
            { id: "1", title: "Physics: Kinematics Lecture 01", date: "25 March 2026", class: "11", stream: "https://test-streams.mux.dev/x36xhzz/master.m3u8" },
            { id: "2", title: "Maths: Quadratic Equations", date: "24 March 2026", class: "11", stream: "MASTER_M3U8_LINK_HERE" }
        ];

        function loadClass(classId) {
            const grid = document.getElementById('lecture-grid');
            grid.innerHTML = '<p class="col-span-full text-center py-10 opacity-50">Syncing with server...</p>';
            
            // Yahan fetch logic aayega (server.py se)
            setTimeout(() => {
                grid.innerHTML = '';
                sampleData.forEach(lecture => {
                    if(lecture.class === classId) {
                        grid.innerHTML += `
                            <div class="video-card p-4">
                                <div class="bg-gray-800 aspect-video rounded-lg mb-3 flex items-center justify-center relative overflow-hidden">
                                    <i class="fas fa-play text-gray-600 text-2xl"></i>
                                    <span class="absolute bottom-2 right-2 bg-black/60 text-[10px] px-2 py-1 rounded">HLS</span>
                                </div>
                                <h3 class="font-bold text-sm leading-tight h-10 overflow-hidden">${lecture.title}</h3>
                                <p class="text-[10px] text-gray-500 mt-1 uppercase">${lecture.date}</p>
                                <button onclick="playLecture('${lecture.stream}', '${lecture.title}')" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold transition">WATCH LECTURE</button>
                            </div>
                        `;
                    }
                });
            }, 800);
        }

        function playLecture(url, title) {
            document.getElementById('player-container').classList.remove('hidden');
            document.getElementById('current-title').innerText = title;
            
            const player = videojs('my-video');
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const player = videojs('my-video');
            player.pause();
            document.getElementById('player-container').classList.add('hidden');
        }

        // Auto Load Class 11 on Start
        window.onload = () => loadClass('11');
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
