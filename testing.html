<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderZ X Vibrant Academy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#010409}
    #_z{position:fixed;top:0;left:0;width:100%;height:100%;background:#010409;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#38bdf8;font-family:monospace;gap:12px}
    ._v{width:100px;height:2px;background:#161b22;position:relative}
    ._v::after{content:'';position:absolute;width:40%;height:100%;background:#38bdf8;animation:L .8s infinite}
    @keyframes L{0%{left:0}50%{left:60%}100%{left:0}}
</style>
</head>
<body>
<div id="_z"><div>Validating Session...</div><div class="_v"></div></div>
<div id="_R"></div>

<script>
(function(){
    const a = atob;
    
    // 1. CONFIG (Base64 for basic protection)
    const s = {
        u: a("aHR0cHM6Ly9lZHV2aWJlLXZpYnJhbnQucGFnZXMuZGV2L25ldy1jb3Vyc2VzLzgvY29udGVudC8="),
        t: a("aHR0cHM6Ly90Lm1lLys4dFpTSjVGeVRYVmpNMk0x"),
        n1: a("RGV2YW5zaCBTaGFybWE="),
        n2: a("QXNzYXVsdCBEZWNvZGVy")
    };

    // 2. INDIAN SHORTNER LINK (Yahan apna link dalo)
    const MY_SHORT_LINK = "PASTE_YOUR_LINK_HERE"; 

    // 3. DATE-BASED TOKEN (Har 24 ghante me badlega)
    const getTodayKey = () => {
        const d = new Date();
        return btoa(d.getDate() + "-" + (d.getMonth()+1) + "-" + d.getFullYear() + "DEV_SECRET").substring(0, 10);
    };
    const currentKey = getTodayKey();

    // 4. BYPASS PROTECTION LOGIC
    const checkAccess = () => {
        const now = new Date().getTime();
        const lastAccess = localStorage.getItem("_auth_time");
        const lastToken = localStorage.getItem("_auth_token");
        const expiry = 24 * 60 * 60 * 1000; // 24 Hours

        const urlParams = new URLSearchParams(window.location.search);
        
        // Agar user shortener se wapas aaya hai (?auth=verify)
        if (urlParams.get("auth") === "verify") {
            localStorage.setItem("_auth_time", now);
            localStorage.setItem("_auth_token", currentKey);
            // URL clean karke entry do
            window.history.replaceState({}, document.title, window.location.pathname);
            return true;
        }

        // Check Access: Agar token purana hai ya 24h ho gaye, toh redirect karo
        if (!lastAccess || lastToken !== currentKey || (now - lastAccess > expiry)) {
            window.location.href = MY_SHORT_LINK;
            return false;
        }
        return true;
    };

    if (!checkAccess()) return;

    // 5. UI RENDERING
    const c = `.H{height:50px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ddd;z-index:1000;position:relative}.B{font-family:'Space Mono';color:#000;font-weight:900;font-size:12px}.M{width:100%;height:calc(100vh - 50px);overflow:hidden;position:relative;background:#010409}.I{width:100%;height:calc(100% + 320px);border:none;margin-top:-82px;display:block}.S{position:fixed;left:-280px;width:240px;height:100%;background:#0d1117;transition:.3s;z-index:10000;padding:15px;border-right:1px solid #30363d}.S.active{left:0}.X{background:rgba(56,189,248,0.04);padding:10px;border-radius:6px;border:1px solid rgba(56,189,248,0.1);margin-bottom:12px}.F{position:absolute;bottom:0;width:100%;height:30px;background:#0d1117;display:flex;align-items:center;justify-content:center;border-top:1px solid #30363d;z-index:999;font-size:8px;color:#444}.A{padding:8px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#8b949e;text-decoration:none;font-size:11px}#_T{font-size:10px;color:#000;font-weight:bold}#_D{font-size:7px;color:#555}`,
    h = `<div id="_SX" class="S"><div class="X"><div style="margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:#fff">${s.n1}</div><div style="font-size:8px;color:#38bdf8">Lead Architect</div></div><div style="height:1px;background:#333;margin:8px 0"></div><div><div style="font-size:13px;font-weight:700;color:#fff">${s.n2}</div><div style="font-size:8px;color:#38bdf8">Co Founder</div></div></div><a href="${s.t}" target="_blank" class="A"><i class="fab fa-telegram"></i> Join Telegram</a><div class="A" onclick="location.reload()"><i class="fas fa-redo"></i> REFRESH</div><div class="A" onclick="document.getElementById('_SX').classList.remove('active')" style="color:#f85149"><i class="fas fa-times"></i> EXIT</div></div><header class="H"><i class="fas fa-bars" style="color:#000;cursor:pointer" onclick="document.getElementById('_SX').classList.add('active')"></i><div class="B">Developer - Devansh Sharma</div><div style="text-align:right"><div id="_T"></div><div id="_D"></div></div></header><main class="M"><iframe src="${s.u}" class="I"></iframe><div class="F">PROTECTED BY: ${s.n1} & ${s.n2}</div></main>`;

    setTimeout(()=>{
        const e=document.createElement('style');e.innerHTML=c;document.head.appendChild(e);
        document.getElementById('_R').innerHTML=h;document.getElementById('_z').remove();
    },700);

    setInterval(()=>{
        const d=new Date();
        document.getElementById('_T').innerText=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        document.getElementById('_D').innerText=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase();
    },1000);

    document.oncontextmenu=()=>!1;
})();
</script>
</body>
</html>
