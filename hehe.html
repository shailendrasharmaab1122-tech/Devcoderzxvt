<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>
    <video id="vid" playsinline controls autoplay></video>

<script>
    (async () => {
        const params = new URLSearchParams(window.location.search);
        const lId = params.get('lectureId') || params.get('id');
        const bId = params.get('batchId') || params.get('batch_id');
        const vid = document.getElementById('vid');

        try {
            const res = await fetch(`https://DevCoderZ-player.vercel.app/api/player.js?batchId=${bId}&lectureId=${lId}`);
            const data = await res.json();

            const match = data.url.match(/([a-f0-9-]{36})/);
            const id = match ? match[0] : null;
            const hlsUrl = `https://stream.pimaxer.in/${id}/hls/720/main.m3u8`;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(hlsUrl);
                hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play());
            } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
                vid.src = hlsUrl;
                vid.addEventListener('loadedmetadata', () => vid.play());
            }
        } catch (e) {
            console.error(e);
        }
    })();
</script>
</body>
</html>
