<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>DevCoderZ | Secure_System_v3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #010409;
            --surface: #0f172a;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --border: #30363d;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* 1. Header design waisa hi rahega */
        header {
            height: 60px; background: var(--surface);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 1px solid var(--border);
            position: relative; z-index: 2000;
        }

        .logo { font-family: monospace; color: var(--accent); font-weight: 900; font-size: 1.2rem; }

        /* 2. IFRAME TRICK: Yahan se unka popup/header hide hoga */
        .wrapper {
            width: 100%;
            height: calc(100vh - 60px);
            overflow: hidden; /* Bahar ka content cut jayega */
            position: relative;
        }

        iframe {
            width: 100%;
            height: calc(100% + 150px); /* Height thodi badha di */
            border: none;
            position: absolute;
            top: -70px; /* Isse unka top wala popup/header upar nikal jayega */
            left: 0;
        }

        /* Sidebar simple */
        .sidebar {
            position: fixed; left: -300px; width: 260px; height: 100%;
            background: #0d1117; transition: 0.3s; z-index: 10001;
            padding: 20px; border-right: 1px solid var(--border);
        }
        .sidebar.active { left: 0; }
        
        .admin-card {
            background: rgba(56,189,248,0.05); padding: 15px;
            border-radius: 10px; border: 1px solid rgba(56,189,248,0.2);
            margin-bottom: 20px;
        }

        .btn { padding: 12px; display: flex; align-items: center; gap: 10px; color: #8b949e; text-decoration: none; cursor: pointer; }
        .btn:hover { color: var(--accent); background: #161b22; border-radius: 8px; }

    </style>
</head>
<body>

    <div id="sideMenu" class="sidebar">
        <div class="admin-card">
            <div style="font-weight: bold; font-size: 15px;">Devansh Sharma</div>
            <div style="font-size: 10px; color: var(--accent);">FOUNDER</div>
            <div style="margin-top:10px; font-weight: bold; font-size: 15px;">Assault Decoder</div>
            <div style="font-size: 10px; color: var(--accent);">CO-FOUNDER</div>
        </div>
        <div class="btn" onclick="location.reload()"><i class="fas fa-sync"></i> REBOOT</div>
        <div class="btn" onclick="toggleSidebar()"><i class="fas fa-times"></i> CLOSE</div>
    </div>

    <header>
        <i class="fas fa-bars" style="cursor:pointer;" onclick="toggleSidebar()"></i>
        <div class="logo">&lt;DevCoderZ/&gt;</div>
        <div style="font-family: monospace; font-size: 10px; color: var(--accent);">STABLE_V3</div>
    </header>

    <div class="wrapper">
        <iframe src="https://eduvibe-vibrant.pages.dev/"></iframe>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sideMenu').classList.toggle('active');
        }
    </script>
</body>
</html>
